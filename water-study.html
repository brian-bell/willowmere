<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Living water · Willowmere</title>
    <link rel="icon" href="data:," />
    <style>
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        overflow: hidden;
        background: #b5c2ae;
        color: #253e36;
        font-family: system-ui, sans-serif;
      }
      canvas {
        display: block;
        touch-action: none;
      }
      header {
        position: absolute;
        top: 30px;
        left: 34px;
        pointer-events: none;
        text-shadow: 0 1px 18px #fff8;
      }
      .eyebrow {
        font-size: 10px;
        font-weight: 700;
        letter-spacing: 0.23em;
        text-transform: uppercase;
      }
      h1 {
        font:
          38px/1.15 Georgia,
          serif;
        margin: 10px 0;
      }
      header p {
        font-size: 12px;
        margin: 0;
      }
      aside {
        position: absolute;
        right: 24px;
        top: 24px;
        padding: 20px;
        width: 260px;
        border: 1px solid #ffffff80;
        border-radius: 18px;
        background: #f8f7ede8;
        box-shadow: 0 8px 40px #1d39252a;
        backdrop-filter: blur(16px);
      }
      aside p {
        font-size: 12px;
        line-height: 1.6;
        color: #657467;
        margin: 13px 0 18px;
      }
      label {
        display: flex;
        align-items: center;
        justify-content: space-between;
        font-size: 12px;
        margin: 12px 0;
        gap: 10px;
      }
      select,
      button,
      a {
        color: inherit;
        font:
          12px system-ui,
          sans-serif;
      }
      select,
      button {
        border: 1px solid #6e80643a;
        border-radius: 8px;
        background: #fff8;
        padding: 9px 10px;
        cursor: pointer;
      }
      select {
        width: 126px;
      }
      button {
        min-height: 38px;
      }
      .actions {
        display: flex;
        gap: 8px;
        margin-top: 18px;
      }
      .actions button {
        flex: 1;
      }
      button[aria-pressed="true"] {
        color: #f9f8ef;
        background: #3d6354;
      }
      a {
        display: inline-block;
        margin-top: 17px;
        text-decoration: none;
        border-bottom: 1px solid #8a9988;
      }
      :focus-visible {
        outline: 3px solid #50866e;
        outline-offset: 3px;
      }
      footer {
        position: absolute;
        left: 50%;
        bottom: 24px;
        transform: translateX(-50%);
        padding: 11px 20px;
        border-radius: 30px;
        background: #f8f7ede5;
        font-size: 11px;
        white-space: nowrap;
        box-shadow: 0 3px 20px #1d39251a;
      }
      body.dusk header {
        color: #f4edda;
        text-shadow: 0 1px 18px #0005;
      }
      @media (max-width: 700px) {
        header {
          top: 18px;
          left: 20px;
        }
        h1 {
          font-size: 28px;
        }
        header p {
          display: none;
        }
        aside {
          top: auto;
          bottom: 16px;
          right: 16px;
          width: 230px;
          padding: 15px;
        }
        aside p,
        footer {
          display: none;
        }
      }
    </style>
  </head>
  <body>
    <header>
      <div class="eyebrow">Willowmere · Field studies</div>
      <h1>Living water</h1>
      <p>Light, current, and the smallest ripples.</p>
    </header>
    <aside aria-label="Water study controls">
      <div class="eyebrow">Along the water</div>
      <p>
        Follow the river past the mill, or linger beside the fountain. Tap the
        surface to leave a ripple.
      </p>
      <label
        >View
        <select id="view">
          <option value="river">The river</option>
          <option value="fountain">The fountain</option>
          <option value="mill">The millrace</option>
          <option value="low">At the bank</option>
          <option value="village">The village</option>
        </select></label
      >
      <label
        >Light
        <select id="light">
          <option value="day">Afternoon</option>
          <option value="dusk">Blue hour</option>
        </select></label
      >
      <label
        >Quality
        <select id="quality">
          <option value="high">High</option>
          <option value="balanced">Balanced</option>
          <option value="performance">Performance</option>
        </select></label
      >
      <div class="actions">
        <button id="pause" aria-pressed="false">Pause water</button
        ><button id="ripple">Make ripples</button>
      </div>
      <a href="/">Return to the village ↗</a>
    </aside>
    <footer>
      Drag to orbit · Scroll to explore · Tap water to make ripples
    </footer>
    <script type="module" src="/src/water-study.js"></script>
  </body>
</html>
