<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>The Drowsy Heron · Willowmere</title>
    <link rel="icon" href="data:," />
    <style>
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        overflow: hidden;
        color: #f5eedb;
        background: #cfd9c4;
        font-family: system-ui, sans-serif;
      }
      canvas {
        display: block;
      }
      header {
        position: absolute;
        top: 30px;
        left: 36px;
        pointer-events: none;
        text-shadow: 0 1px 12px #1d2a2055;
      }
      .eyebrow {
        font-size: 10px;
        font-weight: 650;
        letter-spacing: 0.22em;
        text-transform: uppercase;
      }
      h1 {
        font:
          38px/1.15 Georgia,
          serif;
        margin: 10px 0 8px;
        font-weight: normal;
      }
      header p {
        font-size: 12.5px;
        margin: 0;
        max-width: 36ch;
        line-height: 1.5;
      }
      nav {
        position: absolute;
        right: 28px;
        top: 30px;
        display: flex;
        flex-wrap: wrap;
        justify-content: flex-end;
        gap: 8px;
        max-width: 780px;
      }
      select,
      button,
      nav a {
        font: inherit;
        font-size: 12px;
        color: #334d3e;
        border: 1px solid #6d806334;
        border-radius: 10px;
        padding: 11px 14px;
        background: #f8f7eaeb;
        text-decoration: none;
      }
      select,
      button {
        cursor: pointer;
      }
      button[aria-pressed="true"] {
        background: #334d3e;
        color: #f5eedb;
      }
      :focus-visible {
        outline: 2px solid #477751;
        outline-offset: 3px;
      }
      #note {
        position: absolute;
        left: 36px;
        bottom: 30px;
        width: min(450px, calc(100vw - 40px));
        background: #f8f7eaeb;
        color: #334d3e;
        border: 1px solid #6d806334;
        border-radius: 14px;
        padding: 15px 18px 16px;
      }
      #note strong {
        display: block;
        font:
          18px/1.25 Georgia,
          serif;
        font-weight: normal;
        margin-bottom: 5px;
      }
      #note p {
        margin: 0;
        font-size: 12.5px;
        line-height: 1.5;
      }
      #hint {
        position: absolute;
        bottom: 34px;
        right: 34px;
        text-align: right;
        font-size: 11px;
        letter-spacing: 0.05em;
        pointer-events: none;
        text-shadow: 0 1px 8px #1d2a2088;
      }
      #plans {
        position: absolute;
        top: 90px;
        right: 28px;
        bottom: 70px;
        width: min(450px, calc(100vw - 40px));
        overflow: auto;
        background: #f6f3e4f5;
        color: #334d3e;
        border: 1px solid #6d806334;
        border-radius: 14px;
        padding: 16px 18px;
      }
      #plans[hidden] {
        display: none;
      }
      #plans h2 {
        font:
          17px/1.2 Georgia,
          serif;
        font-weight: normal;
        margin: 2px 0 6px;
      }
      #plans svg {
        width: 100%;
        height: auto;
        display: block;
        margin-bottom: 12px;
      }
      #plans dl {
        display: grid;
        grid-template-columns: 1fr auto 1fr auto;
        gap: 4px 12px;
        font-size: 12px;
        margin: 0 0 14px;
      }
      #plans dt {
        color: #64745e;
      }
      #plans dd {
        margin: 0;
        font-variant-numeric: tabular-nums;
      }
      svg .wall {
        fill: #5d4a3a;
      }
      svg .floor {
        fill: #e9e0c5;
      }
      svg .floor.gallery {
        fill: #dcd2b0;
      }
      svg .light {
        fill: #9fc0c6;
      }
      svg .furn {
        fill: #c49a68;
        stroke: #6f5338;
        stroke-width: 0.8;
      }
      svg .furn.soft {
        fill: #d9b98c;
      }
      svg .furn.sleeper {
        fill: #a9745c;
      }
      svg .furn.bed {
        fill: #bb8a74;
      }
      svg .post {
        fill: #4b3524;
      }
      svg .fire {
        fill: #d9783a;
      }
      svg .void {
        fill: #cfd5cd;
        stroke: #6f5338;
        stroke-width: 1.5;
      }
      svg .above {
        fill: none;
        stroke: #6f5338;
        stroke-dasharray: 5 4;
      }
      svg .tread {
        stroke: #6f5338;
        stroke-width: 0.7;
      }
      svg text {
        font:
          10.5px Georgia,
          serif;
        fill: #334d3e;
        text-anchor: middle;
      }
      svg text.small {
        font-size: 8.5px;
      }
      svg text.light-text {
        fill: #5a3a20;
      }
      svg .scale rect {
        fill: #334d3e;
      }
      svg .you {
        fill: #c4412d;
        stroke: #fff6e0;
        stroke-width: 2;
      }
      #loading {
        position: absolute;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        color: #334d3e;
        background: #cfd9c4;
        font:
          20px Georgia,
          serif;
      }
      #loading[hidden] {
        display: none;
      }
      @media (max-width: 1240px) {
        #plans {
          top: 134px;
        }
      }
      @media (max-width: 760px) {
        header {
          top: 20px;
          left: 20px;
        }
        h1 {
          font-size: 28px;
        }
        header p {
          display: none;
        }
        nav {
          top: auto;
          bottom: 118px;
          left: 14px;
          right: 14px;
          justify-content: center;
          max-width: none;
        }
        nav select,
        nav button {
          padding: 9px 10px;
        }
        nav a,
        #walk,
        #hint {
          display: none;
        }
        #note {
          left: 14px;
          bottom: 14px;
          width: calc(100vw - 28px);
          padding: 10px 13px;
        }
        #note strong {
          font-size: 15px;
          margin-bottom: 3px;
        }
        #note p {
          font-size: 11px;
          line-height: 1.35;
        }
        #plans {
          top: 76px;
          bottom: 180px;
          right: 14px;
          width: calc(100vw - 28px);
        }
      }
    </style>
  </head>
  <body>
    <header>
      <div class="eyebrow">Willowmere · Architectural studies</div>
      <h1>The Drowsy Heron</h1>
      <p id="tagline"></p>
    </header>
    <nav aria-label="Pub study controls">
      <select id="view" aria-label="Viewpoint"></select>
      <select id="cutaway" aria-label="Cutaway"></select>
      <button id="light" aria-pressed="false">Blue hour</button>
      <button id="plan" aria-pressed="false" aria-controls="plans">Plans</button>
      <button id="walk" aria-pressed="false">Walk through</button>
      <a href="/">Visit the village ↗</a>
    </nav>
    <aside id="plans" aria-label="Measured plans" hidden></aside>
    <section id="note" aria-live="polite"><strong></strong><p></p></section>
    <div id="hint"></div>
    <div id="loading">Raising the timbers…</div>
    <script type="module" src="/src/pub-study.js"></script>
  </body>
</html>
